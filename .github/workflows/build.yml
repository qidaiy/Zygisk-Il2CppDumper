name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      # 阶段1：JDK17 仅用于安装SDK工具
      - name: Setup JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download & Configure Android SDK cmdline tools
        run: |
          sudo apt install -y unzip wget
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install CMake 3.18.1 & NDK24 & Android Platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "cmake;3.18.1"
          sdkmanager --install "ndk;24.0.8215888"
          sdkmanager --install "platforms;android-33"

      # 阶段2：切换JDK11 用于Gradle编译
      - name: Setup JDK 11 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Optimize gradle config & mirror
        run: |
          # 仅替换mavenCentral为阿里云，保留google官方源下载插件
          sed -i 's/mavenCentral()/maven { url "https:\/\/maven.aliyun.com\/repository\/central" }/g' build.gradle
          # 单行追加配置，避免多行EOF语法坑
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "systemProp.org.gradle.internal.http.connectionTimeout=120000" >> gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=120000" >> gradle.properties
          echo "android.overridePathCheck=true" >> gradle.properties

      - name: Modify package name
        run: |
          sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h

      - name: Build Module
        run: |
          chmod +x ./gradlew
          ./gradlew :module:assembleRelease --stacktrace --info --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper-module
          path: out/magisk_module_release/
